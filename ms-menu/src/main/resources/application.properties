spring.application.name=ms-menu

spring.datasource.url=jdbc:postgresql://localhost:5432/menu_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Autenticación y autorización.
# El valor por defecto es SOLO para desarrollo local. En despliegues reales
# definir JWT_SECRET con al menos 32 bytes aleatorios.
kds.security.jwt.secret=${JWT_SECRET:kds-dev-only-secret-change-me-please-2026}
kds.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
kds.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5174,http://localhost:5175,http://localhost:5176}

# Bootstrap del primer ADMIN. Sin ADMIN_PASSWORD no se crea ninguna cuenta.
kds.admin.email=${ADMIN_EMAIL:}
kds.admin.password=${ADMIN_PASSWORD:}
kds.admin.name=${ADMIN_NAME:Administrador KDS}