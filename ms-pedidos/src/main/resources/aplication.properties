# Nombre del Microservicio
spring.application.name=ms-pedidos

# Puerto de escucha
server.port=8082

# Configuración de Base de Datos Independiente (pedidos_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración del Broker RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuración de Orígenes Permitidos para WebSockets
kds.websocket.allowed-origins=*
