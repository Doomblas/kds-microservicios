spring.application.name=ms-display-cocina
server.port=${SERVER_PORT:8083}

# Base de datos exclusiva del microservicio
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cocina_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# WebSocket
kds.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}

# Observabilidad y documentacion
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
